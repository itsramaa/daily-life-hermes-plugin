[project]
name = "hermes-plugin-daily-life"
version = "0.1.0"
description = "Master daily orchestrator for Hermes agent: interoception, resilient briefing, adaptive planning, connecting dot adapters, and learning optimization."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::ResourceWarning",
]
